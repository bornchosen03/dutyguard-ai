name: Scheduled Run All

on:
  schedule:
    - cron: '0 6 * * *' # Daily at 06:00 UTC (adjust as needed)
  workflow_dispatch: {}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install playwright requests || true
          python -m playwright install --with-deps || true

      - name: Run orchestration
        run: |
          chmod +x scripts/run_all.py
          python3 scripts/run_all.py --once
